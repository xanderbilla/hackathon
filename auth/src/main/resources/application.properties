spring.application.name=auth
server.servlet.context-path=/api/v1
server.port=8082

# Eureka Client Configuration
eureka.client.service-url.defaultZone=http://localhost:8761/api/v1/service/eureka/
eureka.instance.prefer-ip-address=true
eureka.instance.lease-renewal-interval-in-seconds=30
eureka.instance.lease-expiration-duration-in-seconds=90

# Actuator Configuration
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.health.defaults.enabled=true

# Logging Configuration
logging.level.com.hackathon.auth=DEBUG

# CORS Configuration
cors.allowed.origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001}

# Database Configuration
# Primary datasource - Local User DB
spring.datasource.url=${LOCAL_USER_DB_URL:jdbc:mysql://localhost:3306/local_user_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:xanderbilla}
spring.datasource.password=${DB_PASSWORD:0b1001001@}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true

# Additional Database Configurations for Cross-DB Operations
# Aadhaar DB Configuration
app.datasource.aadhaar.url=${AADHAAR_DB_URL:jdbc:mysql://localhost:3306/aadhaar_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
app.datasource.aadhaar.username=${DB_USERNAME:xanderbilla}
app.datasource.aadhaar.password=${DB_PASSWORD:0b1001001@}

# Bank DB Configuration
app.datasource.bank.url=${BANK_DB_URL:jdbc:mysql://localhost:3306/bank_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
app.datasource.bank.username=${DB_USERNAME:xanderbilla}
app.datasource.bank.password=${DB_PASSWORD:0b1001001@}
